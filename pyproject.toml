[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shopmini-grpo"
version = "0.1.0"
description = "Independent single-GPU GRPO experiments with verifiable shopping rewards"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.11.0",
  "transformers==5.3.0",
  "peft==0.19.0",
  "accelerate==1.12.0",
  "safetensors>=0.7,<1",
  "psutil>=7,<8",
  "filelock>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
shopmini = "shopmini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shopmini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
